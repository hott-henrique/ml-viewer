[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ml-viewer"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "pandas>=3.0.5",
  "numpy>=2.4.6",
  "scikit-learn>=1.9.0",
  "matplotlib>=3.11.1",
  "pydantic>=2.13.4",
  "SQLAlchemy>=2.0.51",
  "platformdirs>=4.11.0",
  "mlxtend>=0.23.0",
  "gymnasium>=1.0.0",
  "pygame>=2.5.0",
  "Pillow>=10.0.0",
]

[project.scripts]
ml-viewer = "application.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
application = ["locales/**/*.mo"]
